spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
  main:
    banner-mode: off

server:
  port: 33400

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

app:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    listeners:
      auto-startup: true
    admin:
      auto-create-topics: true